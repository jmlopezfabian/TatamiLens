[project]
name = "tatami-train"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Datasets, etiquetado y entrenamiento para clasificar posiciones de BJJ (TatamiLens)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "opencv-python>=4.9",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "pillow>=10",
    "torch>=2.4",
    "transformers>=4.45",
    "tatami-vision",
]

[project.scripts]
tatami-train = "tatami_train.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["slow: descarga/usa el backbone real de HF (omitido por defecto)"]
addopts = "-m 'not slow'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv.sources]
tatami-vision = { path = "../tatami-vision", editable = true }
