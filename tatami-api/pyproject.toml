[project]
name = "tatami-api"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Backend HTTP de TatamiLens: videos, análisis en background, etiquetas."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "opencv-python-headless>=4.9",
    "tatami-vision",
]

[project.scripts]
tatami-api = "tatami_api.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tatami_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
tatami-vision = { path = "../tatami-vision", editable = true }
